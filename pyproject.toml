[project]
name = "conduit-api"
version = "0.2.0"
description = "Realworld is a medium clone. This implementation uses FastAPI with DDD lite architecture to create a backend service for the blog."
authors = [{ name = "Bogdan Veliscu", email = "bogdan.veliscu@outlook.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<4.0"

dependencies = [
    # FastAPI core
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.1,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.5.0,<3.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.35,<3.0",
    "alembic>=1.13.3,<2.0",
    "asyncpg>=0.29.0,<1.0",
    "psycopg2-binary>=2.9.9,<3.0",

    # Authentication
    "python-jose[cryptography]>=3.3.0,<4.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "python-multipart>=0.0.12,<1.0",

    # Redis
    "redis>=5.1.0,<6.0",
    "hiredis>=2.4.0,<3.0",

    # Storage & Images
    "boto3>=1.35.10,<2.0",
    "pillow>=11.0.0",

    # Utilities
    "python-slugify>=8.0.4,<9.0",
    "markdown>=3.7",

    # Performance & Monitoring
    "blackfire>=1.20.22",
]

[tool.uv]
dev-dependencies = [
    # Testing
    "pytest>=8.3.2,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "pytest-cov>=6.0.0,<7.0",
    "httpx>=0.27.0,<1.0",
    "factory-boy>=3.3.1,<4.0",
    "faker>=30.0.0,<31.0",

    # Linting & Type Checking
    "ruff>=0.7.0,<1.0",
    "mypy>=1.13.0,<2.0",

    # Load Testing
    "locust>=2.32.3,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["venv", ".venv", "alembic", "tests"]

[[tool.mypy.overrides]]
module = [
    "passlib.*",
    "jose.*",
    "factory.*",
    "faker.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--strict-markers",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires database, redis, etc.)",
    "e2e: End-to-end tests (full API tests)",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true
