<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5cb85c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449d44;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#gradient)"/>

  <!-- Conduit symbol - representing flow/connection -->
  <!-- Top circle (source) -->
  <circle cx="256" cy="140" r="35" fill="white" opacity="0.95"/>

  <!-- Connecting pipe -->
  <rect x="236" y="140" width="40" height="100" fill="white" opacity="0.85" rx="5"/>

  <!-- Flow indicators (dots) -->
  <circle cx="256" cy="180" r="8" fill="#5cb85c"/>
  <circle cx="256" cy="210" r="8" fill="#5cb85c"/>

  <!-- Bottom branching pipes -->
  <path d="M 236 240 L 236 280 L 150 280 L 150 320"
        stroke="white" stroke-width="40" fill="none"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M 276 240 L 276 280 L 362 280 L 362 320"
        stroke="white" stroke-width="40" fill="none"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Bottom circles (destinations) -->
  <circle cx="150" cy="350" r="30" fill="white" opacity="0.95"/>
  <circle cx="362" cy="350" r="30" fill="white" opacity="0.95"/>

  <!-- Text -->
  <text x="256" y="440" font-family="Arial, sans-serif" font-size="60"
        font-weight="bold" fill="white" text-anchor="middle">C</text>
</svg>
